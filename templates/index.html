<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Camera & AI Phân Loại Rác</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 24px; }
    .box { max-width: 520px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 14px; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 12px 22px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; margin: 8px 0 14px; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    .badge { display: inline-block; padding: 10px 22px; border-radius: 999px; font-size: 24px; font-weight: bold; margin: 10px 0; background: #334155; }
    .paper { background: #1d4ed8; color: #dbeafe; }
    .glass { background: #047857; color: #d1fae5; }
    .plastic { background: #b45309; color: #fef3c7; }
    .unknown { background: #7f1d1d; color: #fecaca; }
    img { max-width: 100%; border-radius: 10px; margin-top: 12px; border: 2px solid #475569; }
    .meta { color: #94a3b8; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>📷 Test Camera & AI Nhận Diện Rác</h2>
    <button id="snapBtn" class="btn" onclick="triggerCapture()">📸 Chụp ngay</button>
    <div id="statusText" class="meta">Sẵn sàng</div>

    <div>Loại rác nhận diện được:</div>
    <div id="labelBadge" class="badge">CHƯA CÓ DỮ LIỆU</div>
    <div id="timeText" class="meta">Cập nhật: --:--:--</div>
    <img id="camPreview" src="" alt="Ảnh từ ESP32-CAM" style="display:none;">
  </div>

  <script>
    const viMap = {
      paper: "📄 PAPER (Giấy)",
      glass: "🫙 GLASS (Thủy tinh)",
      plastic: "🥤 PLASTIC (Nhựa)",
      unknown: "❓ Không rõ / Chưa phân loại được"
    };

    let lastUpdated = "";

    async function triggerCapture() {
      const btn = document.getElementById("snapBtn");
      const status = document.getElementById("statusText");
      btn.disabled = true;
      status.textContent = "Đang gửi lệnh chụp tới ESP32-CAM...";
      try {
        await fetch("/api/trigger", { method: "POST" });
        status.textContent = "Đã gửi lệnh! Đang chờ ESP32-CAM chụp & AI xử lý...";
      } catch (e) {
        status.textContent = "Lỗi gửi lệnh tới server!";
      } finally {
        setTimeout(() => { btn.disabled = false; }, 2000);
      }
    }

    setInterval(async () => {
      try {
        const res = await fetch("/api/latest");
        const data = await res.json();
        const badge = document.getElementById("labelBadge");
        const img = document.getElementById("camPreview");
        const status = document.getElementById("statusText");

        if (data.label && data.label !== "none") {
          badge.className = "badge " + data.label;
          badge.textContent = viMap[data.label] || data.label.toUpperCase();
          document.getElementById("timeText").textContent = "Cập nhật lúc: " + data.updated_at;

          if (data.updated_at !== lastUpdated) {
            lastUpdated = data.updated_at;
            status.textContent = "Đã nhận ảnh & kết quả mới!";
          }
        }
        if (data.image_b64) {
          img.src = "data:image/jpeg;base64," + data.image_b64;
          img.style.display = "block";
        }
      } catch (e) {}
    }, 1000);
  </script>
</body>
</html>
